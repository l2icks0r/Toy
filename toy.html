<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Double Index Sine Plot!!</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            canvas {
                display: block;
            }
            .topRightButton {
                position: fixed;
                top: 10px;
                width: 40px;
                height: 40px;
                background-color: rgba(255, 255, 255, 0.3);
                border: none;
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: background-color 0.3s;
            }
            .topRightButton:hover {
                background-color: rgba(255, 255, 255, 0.5);
            }
            .topRightButton svg {
                width: 24px;
                height: 24px;
                fill: #000;
            }
            #fullscreenButton {
                right: 60px;
            }
            #settingsButton {
                right: 10px;
            }
            #settingsPanel {
                position: fixed;
                top: 60px;
                right: -310px;
                width: 280px;
                height: calc(100% - 70px);
                background-color: rgba(32, 0, 64, 0.6);
                border: 2px solid rgb(128, 64, 256);
                transition: right 0.3s ease-in-out;
                padding: 10px;
                overflow-y: auto;
            }
        </style>
    </head>

    <body>
        <canvas id="patternCanvas"></canvas>
        <button id="fullscreenButton" class="topRightButton">
            <svg viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
        </button>
        <button id="settingsButton" class="topRightButton">
            <svg viewBox="0 0 24 24">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
        </button>
        <div id="settingsPanel">
            <!-- Add settings controls here -->
        </div>
        <script>
            // This is a test from Lin00x
            const canvas = document.getElementById('patternCanvas');
            const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true });
            const settingsButton = document.getElementById('settingsButton');
            const settingsPanel = document.getElementById('settingsPanel');

            let width, height, centerX, centerY;

            // Points are positioned entirely in the vertex shader from gl_VertexID and the theta uniforms
            const pointProgram = createProgram(`#version 300 es
                precision highp float;
                uniform vec4 uTheta;   // x0, x1, y0, y1 at the first point
                uniform vec4 uSpace;   // per-point step for each theta
                uniform vec2 uCenter;
                uniform vec2 uSize;
                void main() {
                    vec4 t = uTheta + float(gl_VertexID) * uSpace;
                    float x = floor(uCenter.x * (sin(t.x) + sin(t.y)) * 0.5 + uCenter.x + 0.5);
                    float y = floor(uCenter.y * (sin(t.z) + sin(t.w)) * 0.5 + uCenter.y + 0.5);
                    gl_Position = vec4((x + 0.5) / uSize.x * 2.0 - 1.0, 1.0 - (y + 0.5) / uSize.y * 2.0, 0.0, 1.0);
                    gl_PointSize = 1.0;
                }`, `#version 300 es
                precision highp float;
                uniform vec3 uColor;
                out vec4 outColor;
                void main() {
                    outColor = vec4(uColor, 1.0);
                }`);

            // Full-screen triangle for the fade pass
            const fadeProgram = createProgram(`#version 300 es
                void main() {
                    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
                    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
                }`, `#version 300 es
                precision highp float;
                uniform float uSubtract;
                out vec4 outColor;
                void main() {
                    outColor = vec4(vec3(uSubtract), 1.0);
                }`);

            const pointUniforms = {
                theta: gl.getUniformLocation(pointProgram, 'uTheta'),
                space: gl.getUniformLocation(pointProgram, 'uSpace'),
                center: gl.getUniformLocation(pointProgram, 'uCenter'),
                size: gl.getUniformLocation(pointProgram, 'uSize'),
                color: gl.getUniformLocation(pointProgram, 'uColor')
            };
            const fadeSubtractUniform = gl.getUniformLocation(fadeProgram, 'uSubtract');

            const MAX_POINTS = 5000;
            
            let currentHue = Math.random() * 360;
            let targetHue = Math.random() * 360;
            let transitionProgress = 0;
            const TRANSITION_SPEED = 0.0075;

            let theta_x0 = 0;
            let theta_x1 = 0;
            let theta_y0 = 0;
            let theta_y1 = 0;

            let theta_x0_inc = -.02;
            let theta_x1_inc = .03;
            let theta_y0_inc = -.02;
            let theta_y1_inc = -.022;

            let theta_x0_space = .012;
            let theta_x1_space = -.014;
            let theta_y0_space = .010;
            let theta_y1_space = -.008;

            fullscreenButton.addEventListener('click', toggleFullScreen);
            settingsButton.addEventListener('click', toggleSettingsPanel);
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            drawPattern();

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                centerX = Math.floor(width / 2);
                centerY = Math.floor(height / 2);

                // Clear the canvas
                gl.viewport(0, 0, width, height);
                gl.clearColor(0, 0, 0, 1);
                gl.clear(gl.COLOR_BUFFER_BIT);
            }

            function createProgram(vertexSource, fragmentSource) {
                const program = gl.createProgram();
                for (const [type, source] of [[gl.VERTEX_SHADER, vertexSource], [gl.FRAGMENT_SHADER, fragmentSource]]) {
                    const shader = gl.createShader(type);
                    gl.shaderSource(shader, source);
                    gl.compileShader(shader);
                    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                        throw new Error(gl.getShaderInfoLog(shader));
                    }
                    gl.attachShader(program, shader);
                }
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    throw new Error(gl.getProgramInfoLog(program));
                }
                return program;
            }

            function drawPattern() {
                // update the color transition
                transitionProgress += TRANSITION_SPEED;
                if( transitionProgress >= 1 ) {
                    currentHue = targetHue;
                    targetHue = Math.random() * 360;
                    transitionProgress = 0;
                }

                let hue = currentHue + (targetHue - currentHue) * transitionProgress;

                plotPoints( hsvToRgb( hue, 1, 1 ) );

                // The thetas advance by one frame increment; the per-point steps are applied in the shader
                theta_x0 += theta_x0_inc;
                theta_x1 += theta_x1_inc;

                theta_y0 += theta_y0_inc;
                theta_y1 += theta_y1_inc;

                fadeScreen();
                drawScreenOutline();

                requestAnimationFrame(drawPattern);
            }

            function plotPoints( color ) {
                // Wrap the angles so the shader's float32 sin() keeps its precision as they accumulate
                const wrap = theta => theta % (2 * Math.PI);

                gl.disable(gl.BLEND);
                gl.useProgram(pointProgram);
                gl.uniform4f(pointUniforms.theta, wrap(theta_x0), wrap(theta_x1), wrap(theta_y0), wrap(theta_y1));
                gl.uniform4f(pointUniforms.space, theta_x0_space, theta_x1_space, theta_y0_space, theta_y1_space);
                gl.uniform2f(pointUniforms.center, centerX, centerY);
                gl.uniform2f(pointUniforms.size, width, height);
                gl.uniform3fv(pointUniforms.color, color);
                gl.drawArrays(gl.POINTS, 0, MAX_POINTS);
            }

            function fadeScreen() {
                // Fade towards black: dst = dst * (1 - FADE) - 0.5/255. Plain alpha blending rounds to nearest in
                // 8 bits, so values below ~17 would never decay and leave a permanent haze; the small subtraction
                // makes the result round down instead, so every value keeps fading to zero.
                const FADE = 0.03;
                gl.enable(gl.BLEND);
                gl.blendEquation(gl.FUNC_REVERSE_SUBTRACT);
                gl.blendFunc(gl.ONE, gl.CONSTANT_ALPHA);
                gl.blendColor(0, 0, 0, 1 - FADE);
                gl.useProgram(fadeProgram);
                gl.uniform1f(fadeSubtractUniform, 0.5 / 255);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                gl.blendEquation(gl.FUNC_ADD);
            }

            function drawScreenOutline() {
                // Draw render area rectangle lines (WebGL can't stroke wide lines, so clear thin scissored strips)
                const thickness = 2;
                gl.disable(gl.BLEND);
                gl.enable(gl.SCISSOR_TEST);
                gl.clearColor(0x80 / 255, 0x40 / 255, 1, 1);
                for (const [x, y, w, h] of [
                    [0, 0, width, thickness],
                    [0, height - thickness, width, thickness],
                    [0, 0, thickness, height],
                    [width - thickness, 0, thickness, height]
                ]) {
                    gl.scissor(x, y, w, h);
                    gl.clear(gl.COLOR_BUFFER_BIT);
                }
                gl.disable(gl.SCISSOR_TEST);
                gl.clearColor(0, 0, 0, 1);
            }

            function toggleFullScreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }

            function toggleSettingsPanel() {
                if (settingsPanel.style.right === '-10px') {
                    settingsPanel.style.right = '-400px';
                } else {
                    settingsPanel.style.right = '-10px';
                }
            }

            function hsvToRgb(h, s, v) {
                h = Math.max(0, Math.min(360, h));
                s = Math.max(0, Math.min(1, s));
                v = Math.max(0, Math.min(1, v));

                let c = v * s;
                let x = c * (1 - Math.abs((h / 60) % 2 - 1));
                let m = v - c;

                let r, g, b;
                if (h >= 0 && h < 60) {
                    [r, g, b] = [c, x, 0];
                } else if (h >= 60 && h < 120) {
                    [r, g, b] = [x, c, 0];
                } else if (h >= 120 && h < 180) {
                    [r, g, b] = [0, c, x];
                } else if (h >= 180 && h < 240) {
                    [r, g, b] = [0, x, c];
                } else if (h >= 240 && h < 300) {
                    [r, g, b] = [x, 0, c];
                } else {
                    [r, g, b] = [c, 0, x];
                }

                return [r + m, g + m, b + m];
            }
        </script>
    </body>
</html>
